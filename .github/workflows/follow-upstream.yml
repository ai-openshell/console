# Follow upstream OpenShell releases (ADR 0005, decisions 6 to 8, as amended
# on 2026-11-06).
#
# A branch of this repository is built on ONE upstream release, named by
# deploy/ci/gateway-pins.json, and ci.yml tests every change against it. This
# workflow is what moves that pin. Once a day it reads upstream's git tags and
# picks a target:
#
#   the newest stable release (vX.Y.Z) above the one main pins, if there is one;
#   otherwise the newest pre-release (vX.Y.Z-pre.N) leading up to a release
#   above it; otherwise nothing, and the run ends.
#
# A person can also run it by hand with a `version`, and that is the target.
#
# With a target it does two things.
#
#   bump       Opens a bump: the branch bump/openshell-<version>, which is main
#              plus ONE commit that moves the pin (gateway and supervisor
#              images, and the Go SDK at the tag's commit, together), and a
#              pull request into main. A scheduled run bumps only to a stable
#              release; a version asked for by hand is bumped to as it is, so
#              a pre-release gets a prep branch. The bot makes a bump branch
#              ONCE: when the branch exists, or any pull request has come from
#              it, it does nothing. It never rebases, moves or force-pushes
#              one; people push the fixes a move needs to it like any branch.
#
#   check A    Runs the compatibility suite with the BFF as main builds it
#              today against the target's gateway. That is what a dashboard
#              already installed will meet when the gateway is upgraded under
#              it, and the early warning for a pre-release. A failure goes to
#              one issue, rewritten in place and closed when it passes again.
#
# Nothing here releases. A release is cut by hand (publish.yml).
#
# Invariants. Each is enforced in code, not only stated here:
#   1. Only vX.Y.Z and vX.Y.Z-pre.N are followed.     versions.py
#      dev / HEAD and @latest are never pinned.       pins.py, pinmove.py
#   2. Images are pinned by digest, and check A       plan.py
#      tests the digests the bump pins.
#   3. Every compat run uses -count=1.                tests/test_workflows.py
#   4. No ${{ }} inside a run: script; values         tests/test_workflows.py
#      reach scripts through env:.
#   5. Least-privilege permissions per job.           tests/test_workflows.py
#   6. The job that can write (publish-bump) builds,   tests/test_workflows.py
#      tests and fetches nothing. The job that makes
#      the commit (bump) holds no write token and no
#      environment, so a dry run previews it from any
#      ref. Only the publish step sees the App token.
#   7. The job that runs upstream's gateway image     tests/test_workflows.py
#      (check-a) can read the repository and
#      nothing more.
#   8. A bump branch is created, never moved, and     publish.py, follow.py
#      never moves main's pin backward.
#
# TOKENS. The publish-bump job pushes and opens the pull request with a token of the
# organization's bump-bot GitHub App, made at the start of the job from the
# App's client ID and private key. Those secrets live in the `bump-bot`
# environment, which only `main` can deploy to, so a run from any other ref
# cannot reach them. An App's pull request starts CI like a person's does;
# one opened with the workflow's default token would start none, which is why
# the default token is not used for it. The token is asked for with the two
# permissions the job needs, contents and pull requests, and nothing else.
# Every other job uses the default token, read only except the report's
# issues: write.

name: Follow upstream

on:
  schedule:
    # Once a day, at 06:17 UTC: off the top of the hour, when scheduled runs
    # queue up behind everyone else's.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "OpenShell release to bump to, without the v (0.2.0 or 0.2.0-pre.1). Empty: the newest stable release above main's pin"
        type: string
        default: ""
      dry_run:
        description: "Dry run: say what would be done; push, open and edit nothing"
        type: boolean
        default: true

# Nothing by default. Every job asks for exactly what it uses.
permissions: {}

# A bump branch and the issue are written by one run at a time, so runs on main
# queue behind each other. A
# run from any other ref is a dry run that touches none of them. It gets a
# group of its own: GitHub keeps only ONE pending run per group, so two dry
# runs in the shared group could cancel the scheduled run that was waiting.
concurrency:
  group: follow-upstream-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  FOLLOW: python3 deploy/ci/upstream/follow.py
  # 'true' or 'false'. A scheduled run acts. A manual run acts only when its
  # box was cleared, and a run from anything but main never does.
  DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

jobs:
  plan:
    name: What is upstream ahead of main?
    # A fork inherits this file. On a schedule it must not start opening bumps
    # of its own; someone who starts it by hand there meant to.
    if: ${{ github.event_name != 'schedule' || !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pinned: ${{ steps.plan.outputs.pinned }}
      has_target: ${{ steps.plan.outputs.has_target }}
      ready: ${{ steps.plan.outputs.ready }}
      target: ${{ steps.plan.outputs.target }}
      same_line: ${{ steps.plan.outputs.same_line }}
      bump: ${{ steps.plan.outputs.bump }}
      branch: ${{ steps.plan.outputs.branch }}
      gateway_image: ${{ steps.plan.outputs.gateway_image }}
      supervisor_image: ${{ steps.plan.outputs.supervisor_image }}
      sandbox_image: ${{ steps.plan.outputs.sandbox_image }}
      config_schema: ${{ steps.plan.outputs.config_schema }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Unit-test the upstream logic
        run: python3 -m unittest discover -s deploy/ci/upstream

      # Upstream's tags (git ls-remote) and the digests the target's images
      # have right now (docker buildx imagetools inspect). Resolved once, here,
      # so check A tests exactly the images the bump pins even if upstream
      # pushes a tag again while the run is going.
      - name: Find the release to follow
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          $FOLLOW plan --version "$VERSION" --dry-run "$DRY_RUN" --out /tmp/upstream/plan.json --summary /tmp/upstream/plan.md
          cat /tmp/upstream/plan.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-plan
          path: /tmp/upstream/plan.json
          if-no-files-found: error
          retention-days: 7

  # Makes the bump commit. It holds no write token and needs no environment,
  # so it runs from any ref: a dry run anywhere previews the bump in full. It
  # runs git; `go get`, `go mod tidy` and `go list -m`, which download modules
  # and execute none of them; and this repository's own scripts. The commit is
  # handed to publish-bump as a git bundle.
  bump:
    name: Make the bump to OpenShell ${{ needs.plan.outputs.target }}
    needs: plan
    if: needs.plan.outputs.bump == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # which pull requests have come from the bump branch
    env:
      GH_REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      BRANCH: ${{ needs.plan.outputs.branch }}
    outputs:
      made: ${{ steps.bump.outputs.made }}
    steps:
      # Every branch: whether the bump branch exists is read from what was
      # fetched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # No cache is restored into a job whose result is published.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # For scripts/readme-gateway-range.mjs only.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-plan
          path: /tmp/upstream

      # `--head` matches the branch NAME, in this repository and in every
      # fork, so what comes back is only a list of candidates. Which of them
      # is ours is decided by publish.py from isCrossRepository.
      - name: List the pull requests from the bump branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --head "$BRANCH" --state all --limit 100 \
            --json number,headRefName,isCrossRepository,state,url \
            > /tmp/upstream/pulls.json

      - name: Make the bump commit
        id: bump
        env:
          # setup-go pins the toolchain to the one it installed. A release
          # whose SDK needs a newer Go has to be able to say so in go.mod, or
          # the bump could not be made for it at all; CI on the bump then
          # shows what else has to follow.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          $FOLLOW bump --plan /tmp/upstream/plan.json --pulls /tmp/upstream/pulls.json \
            --repo-url "$REPO_URL" --dry-run "$DRY_RUN" --out /tmp/upstream/bump
          cat /tmp/upstream/bump/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle the bump commit for publish-bump
        if: steps.bump.outputs.made == 'true'
        run: git bundle create /tmp/upstream/bump/bump.bundle refs/upstream/bump

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-bump
          path: /tmp/upstream/bump
          if-no-files-found: error
          retention-days: 7

  # Pushes the bump and opens its pull request, with a token of the bump-bot
  # App. Its secrets are in the `bump-bot` environment, which only main can
  # use, so this job runs only for a run on main that is not a dry run. It
  # builds nothing and fetches no module: it checks main out as it is NOW,
  # refuses a bump main has caught up with, takes the commit from the bundle,
  # and only then asks for the token, which only the publishing step is handed.
  publish-bump:
    name: Open the bump to OpenShell ${{ needs.plan.outputs.target }}
    needs: [plan, bump]
    # The same test as DRY_RUN above, which a job-level `if` cannot read.
    if: needs.bump.outputs.made == 'true' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    environment: bump-bot
    permissions:
      contents: read
    steps:
      # main as it is now, not as the plan found it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-plan
          path: /tmp/upstream
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-bump
          path: /tmp/upstream/bump

      # The bump commit was made from main as it was when the run started. If
      # main's pin has reached or passed the target since, publishing would
      # move main back, and the bot never refreshes a bump branch.
      - name: Refuse a bump main has caught up with
        run: $FOLLOW check-forward --plan /tmp/upstream/plan.json --pins deploy/ci/gateway-pins.json

      - name: Take the bump commit from the bundle
        run: git fetch -q /tmp/upstream/bump/bump.bundle refs/upstream/bump:refs/upstream/bump

      # A token of the bump-bot App, limited to this repository and to what
      # the step after it does with it.
      - name: Get a token for the bump-bot App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BUMP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # `publish` runs `git push` and `gh` with the arguments the bump job
      # chose, and nothing else.
      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          status=0
          $FOLLOW publish --plan /tmp/upstream/bump/publish.json --dry-run "$DRY_RUN" \
            --summary /tmp/upstream/bump/published.md || status=$?
          if [ -f /tmp/upstream/bump/published.md ]; then
            cat /tmp/upstream/bump/published.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Check A: the BFF exactly as main builds it, against the target's gateway.
  #
  # This is the job that runs upstream's gateway image, so it can read the
  # repository and nothing else, and no secret reaches it. backend/go.mod is
  # never modified here: the question is about the dashboard we ship, on the SDK
  # it ships with.
  check-a:
    name: "Check A: main against OpenShell ${{ needs.plan.outputs.target }}"
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENSHELL_GATEWAY_IMAGE: ${{ needs.plan.outputs.gateway_image }}
      OPENSHELL_SUPERVISOR_IMAGE: ${{ needs.plan.outputs.supervisor_image }}
      OPENSHELL_CONFIG_SCHEMA: ${{ needs.plan.outputs.config_schema }}
      # The same digest-pinned workload image as ci.yml's compat job: this
      # varies the gateway, not the workload.
      COMPAT_SANDBOX_IMAGE: ${{ needs.plan.outputs.sandbox_image }}
      # A target on main's own release line has to be judged "supported" by a
      # BFF that is told nothing. A target that starts a new line is judged
      # "unsupported", correctly, so nothing is asserted about it.
      COMPAT_EXPECT_COMPATIBILITY: ${{ needs.plan.outputs.same_line == 'true' && 'supported' || '' }}
      # With -mod=readonly Go refuses to change go.mod, and the diff below
      # proves it did not.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the BFF from the checked-in go.mod
        run: |
          set -euo pipefail
          (cd backend && go build -o ../bin/server ./cmd/server)
          git diff --exit-code -- backend/go.mod backend/go.sum

      # From here on a failing step is a RESULT, not an error, so it must not
      # fail the job. Each of the next four needs the one before it, and the
      # first that does not succeed names what happened: an image that cannot
      # be pulled, a gateway that never starts and a BFF that never becomes
      # healthy are all recorded as "could not be tested". No request reached
      # the gateway, so they say nothing about compatibility.
      - name: Pull images
        id: pull
        continue-on-error: true
        run: |
          set -euo pipefail
          docker pull "$OPENSHELL_GATEWAY_IMAGE"
          docker pull "$OPENSHELL_SUPERVISOR_IMAGE"
          docker pull "$COMPAT_SANDBOX_IMAGE"

      # When the gateway does not become healthy, e2e-stack.sh prints its log
      # itself, before it tears the stack down: afterwards there is no
      # container left to ask.
      - name: Start gateway stack
        id: stack
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BRIDGE=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          export OPENSHELL_GRPC_ENDPOINT="http://${BRIDGE}:8080"
          deploy/ci/e2e-stack.sh up

      - name: Start the BFF
        id: bff
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          AUTH_DISABLED=true OPENSHELL_GATEWAY_URL=localhost:8080 PORT=9080 ./bin/server &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9080/api/v1/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9080/api/v1/healthz >/dev/null

      # -count=1: the suite talks to a live gateway, which Go's test cache
      # cannot see. A cached pass against the pinned gateway must never stand
      # in for this one.
      - name: Run compat suite
        id: compat
        if: steps.bff.outcome == 'success'
        continue-on-error: true
        env:
          BFF_URL: http://localhost:9080
        run: cd backend && go test -tags compat -count=1 -v -timeout 20m ./test/compat/...

      - name: Record result
        env:
          PULL: ${{ steps.pull.outcome }}
          STACK: ${{ steps.stack.outcome }}
          BFF: ${{ steps.bff.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
        run: |
          set -euo pipefail
          $FOLLOW record-check --pull "$PULL" --stack "$STACK" --bff "$BFF" --compat "$COMPAT" \
            --out /tmp/upstream/check-a.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-check-a
          path: /tmp/upstream/check-a.json
          if-no-files-found: error
          retention-days: 7

      # Only while the stack is still up. A gateway that never started has
      # already printed its log from inside e2e-stack.sh.
      - name: Gateway logs
        if: always() && (steps.bff.outcome == 'failure' || steps.compat.outcome == 'failure')
        run: docker compose -f deploy/ci/docker-compose.e2e.yml logs --tail=200 || true

      - name: Clean up
        if: always()
        run: deploy/ci/e2e-stack.sh down

  # Says what check A's result means and keeps the one issue. Runs when check
  # A was skipped, too: with nothing ahead of main, an issue about a release
  # main has since moved to must not stay open.
  #
  # !cancelled(), not always(): always() is true for a cancelled run too, so
  # pressing Cancel would not have stopped this job from rewriting the issue.
  report:
    name: Report check A
    needs: [plan, check-a]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-plan
          path: /tmp/upstream
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # No result is a state the report handles: check A was skipped, or it
        # broke before it could record one.
        continue-on-error: true
        with:
          name: upstream-check-a
          path: /tmp/upstream

      - name: Decide what the result means
        id: report
        run: |
          set -euo pipefail
          $FOLLOW check-report --plan /tmp/upstream/plan.json --result /tmp/upstream/check-a.json \
            --run-url "$RUN_URL" --repo-url "$REPO_URL" --dry-run "$DRY_RUN" --out /tmp/upstream/report
          cat /tmp/upstream/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Never in a dry run. Found by label, not by title: the title names the
      # release, which changes. Only OPEN issues count, so closing one means
      # "handled".
      - name: Maintain the issue
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.report.outputs.issue_action }}
        run: |
          set -euo pipefail
          gh label create compat-migrate --color b60205 --force \
            --description "Follow upstream: main fails the compatibility suite against an upcoming OpenShell release" >/dev/null 2>&1 || true
          num=$(gh issue list --label compat-migrate --state open --json number --jq '.[0].number // empty')
          case "$ACTION" in
            upsert)
              title=$(cat /tmp/upstream/report/issue-title.txt)
              if [ -n "$num" ]; then
                gh api --method PATCH "repos/$GH_REPO/issues/$num" --silent \
                  -f title="$title" -F body=@/tmp/upstream/report/issue-body.md
                echo "rewrote issue #$num"
              else
                gh issue create --label compat-migrate --title "$title" \
                  --body-file /tmp/upstream/report/issue-body.md
              fi
              ;;
            close)
              if [ -n "$num" ]; then
                gh issue close "$num" --comment "$(cat /tmp/upstream/report/close-comment.md)"
              else
                echo "nothing to close: no issue is open"
              fi
              ;;
            *)
              # keep: the target's images are not published yet, or check A
              # could not be run. Nothing is known, so nothing is changed.
              echo "::notice::Check A reached no result this run, so the issue was left exactly as it is (see the summary)."
              ;;
          esac

      # "Could not be tested" is not a finding. It is the workflow not doing
      # its job, and that is what a red run is for.
      - name: Fail when check A could not be run
        env:
          INCOMPLETE: ${{ steps.report.outputs.incomplete }}
        run: |
          set -euo pipefail
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error::Check A did not reach a result (see the summary). Nothing was concluded from it and the issue was not touched."
            exit 1
          fi
